<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset password • Base</title>
  </head>

  <body style="margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; background:#070507; color:rgba(245,242,238,.92);">
    <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px; text-align:center;">
      <div style="max-width:420px;">
        <div style="font-size:18px; font-weight:900; letter-spacing:.08em;">BASE</div>

        <div id="title" style="margin-top:10px; font-size:13px; font-weight:800; opacity:.9;">
          Opening the app…
        </div>

        <div id="sub" style="margin-top:14px; font-size:12px; font-weight:700; opacity:.72; line-height:1.45;">
          If nothing happens, tap the button below.
        </div>

        <a
          id="openBtn"
          href="base://reset"
          style="display:inline-block; margin-top:18px; padding:12px 16px; border-radius:14px; background:rgba(255,255,255,.10); color:rgba(245,242,238,.92); text-decoration:none; font-weight:900; font-size:13px; border:1px solid rgba(255,255,255,.14);"
        >
          Open Base
        </a>

        <div style="margin-top:18px; font-size:11px; font-weight:700; opacity:.60; line-height:1.4;">
          If you’re on desktop, open the Base app on your phone to finish resetting.
        </div>
      </div>
    </div>

    <script>
      function buildAppUrl() {
        const url = new URL(window.location.href);

        // Supabase may return params in hash (#) or query (?)
        const hashParams = new URLSearchParams((url.hash || "").replace(/^#/, ""));
        const queryParams = url.searchParams;

        const access_token =
          hashParams.get("access_token") || queryParams.get("access_token");
        const refresh_token =
          hashParams.get("refresh_token") || queryParams.get("refresh_token");
        const type =
          hashParams.get("type") || queryParams.get("type") || "";
        const code =
          hashParams.get("code") || queryParams.get("code") || "";
        const token =
          hashParams.get("token") || queryParams.get("token") || "";
        const token_hash =
          hashParams.get("token_hash") || queryParams.get("token_hash") || "";

        const appUrl = new URL("base://reset");

        // Old recovery flow
        if (access_token) appUrl.searchParams.set("access_token", access_token);
        if (refresh_token) appUrl.searchParams.set("refresh_token", refresh_token);
        if (type) appUrl.searchParams.set("type", type);

        // Newer Supabase recovery flow
        if (code) appUrl.searchParams.set("code", code);
        if (token) appUrl.searchParams.set("token", token);
        if (token_hash) appUrl.searchParams.set("token_hash", token_hash);

        return appUrl.toString();
      }

      const appUrl = buildAppUrl();

      // Update manual button
      document.getElementById("openBtn").href = appUrl;

      // If we didn’t detect tokens, warn gently
      if (!appUrl.includes("?")) {
        document.getElementById("title").textContent = "Open the app to continue";
        document.getElementById("sub").textContent =
          "We couldn’t detect reset tokens in this link. Please open the email again or request a new reset.";
      }

      // Auto-open app
      window.location.replace(appUrl);

      // Fallback text update
      setTimeout(() => {
        document.getElementById("title").textContent = "Tap “Open Base” if it didn’t open";
        document.getElementById("sub").textContent =
          "If you’re on iPhone using Gmail, try “Open in Safari” for best results.";
      }, 900);
    </script>
  </body>
</html>
