<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050507" />
    <title>BASE</title>

    <link rel="stylesheet" href="/styles.css?v=20260126-final6" />

    <!-- Preload (prevents flash / broken icons) -->
    <link rel="preload" as="image" href="/assets/base/b.png" />
    <link rel="preload" as="image" href="/assets/base/a.png" />
    <link rel="preload" as="image" href="/assets/base/s.png" />
    <link rel="preload" as="image" href="/assets/base/e.png" />
  </head>

  <body class="preload">
    <main class="hero">
      <div class="hero-inner">
        <div class="logo" aria-label="BASE">
          <div class="slot" style="--delay:0ms;   --x0:-330px; --x1:-120px; --y:6px;">
            <img class="glyph" src="/assets/base/b.png" alt="B" width="96" height="96" decoding="async" loading="eager" />
          </div>

          <div class="slot" style="--delay:180ms; --x0:-110px; --x1:-40px;">
            <img class="glyph" src="/assets/base/a.png" alt="A" width="96" height="96" decoding="async" loading="eager" />
          </div>

          <div class="slot" style="--delay:360ms; --x0:110px;  --x1:40px;">
            <img class="glyph" src="/assets/base/s.png" alt="S" width="96" height="96" decoding="async" loading="eager" />
          </div>

          <div class="slot" style="--delay:540ms; --x0:318px;  --x1:108px; --s:1.065;">
            <img class="glyph" src="/assets/base/e.png" alt="E" width="96" height="96" decoding="async" loading="eager" />
          </div>
        </div>

        <!-- ✅ Safari-safe: real navigation to ornate home (/app/) -->
        <button class="cta" type="button" id="goApp">Get Started</button>
      </div>
    </main>

    <script>
      (function () {
        const images = Array.from(document.querySelectorAll(".glyph"));

        const waitForImg = (img) => {
          if (img.complete && img.naturalWidth > 0) return Promise.resolve();
          if (img.decode) return img.decode().catch(() => {});
          return new Promise((resolve) => {
            img.onload = img.onerror = resolve;
          });
        };

        Promise.all(images.map(waitForImg)).then(() => {
          document.body.classList.add("ready");
          document.body.classList.remove("preload");
        });

        // ✅ Prevent Safari weird “reload same doc” / double-tap issues
        const btn = document.getElementById("goApp");
        let navigating = false;

        if (btn) {
          btn.addEventListener("click", () => {
            if (navigating) return;
            navigating = true;

            // visual tiny feedback (no style change, just disables re-click)
            btn.setAttribute("disabled", "disabled");

            // hard navigate to ornate home
            window.location.href = "/app/";
          });
        }
      })();
    </script>
  </body>
</html>
