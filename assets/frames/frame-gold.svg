      C1110 120 1080 92 1010 90
      C1050 112 1068 142 1068 182
      C1068 132 1040 108 990 108
      C1026 122 1034 150 1028 178
      C1016 146 992 128 952 128" opacity=".95"/>
    <path stroke-width="3.5" d="M1082 154
      C1082 122 1060 104 1028 104
      C1050 112 1060 130 1060 154
      C1060 175 1048 190 1028 198
      C1058 192 1072 176 1082 154" opacity=".8"/>

