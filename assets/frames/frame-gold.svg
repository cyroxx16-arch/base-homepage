<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2c9" stop-opacity=".95"/>
      <stop offset=".22" stop-color="#e6c56f" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#b8862d" stop-opacity=".95"/>
      <stop offset=".78" stop-color="#f2d58b" stop-opacity=".95"/>
      <stop offset="1" stop-color="#9a6b1c" stop-opacity=".95"/>
    </linearGradient>

    <filter id="gGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Corner-only ornate filigree (no full box) -->
  <g fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round" filter="url(#gGlow)">
