    <path d="M120 170 C120 120 150 95 205 95" />
    <path d="M120 170 C155 150 175 130 205 95" />
    <path d="M120 170 C150 210 175 230 220 240" />
    <path d="M205 95 C250 110 285 138 300 170" />
    <path d="M205 95 C220 130 220 155 205 185" />
    <!-- TR -->
    <path d="M1080 170 C1080 120 1050 95 995 95" />
    <path d="M1080 170 C1045 150 1025 130 995 95" />
    <path d="M1080 170 C1050 210 1025 230 980 240" />
    <path d="M995 95 C950 110 915 138 900 170" />
    <path d="M995 95 C980 130 980 155 995 185" />
    <!-- BL -->
    <path d="M120 530 C120 580 150 605 205 605" />
    <path d="M120 530 C155 550 175 570 205 605" />
    <path d="M120 530 C150 490 175 470 220 460" />
    <path d="M205 605 C250 590 285 562 300 530" />
    <path d="M205 605 C220 570 220 545 205 515" />
    <!-- BR -->
    <path d="M1080 530 C1080 580 1050 605 995 605" />
    <path d="M1080 530 C1045 550 1025 570 995 605" />
    <path d="M1080 530 C1050 490 1025 470 980 460" />
    <path d="M995 605 C950 590 915 562 900 530" />
    <path d="M995 605 C980 570 980 545 995 515" />
