  <!-- top/bottom center ornaments -->
  <g stroke="url(#g)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" filter="url(#glow)">
    <path d="M520 78 C560 110 640 110 680 78" />
    <path d="M570 95 C590 130 610 130 630 95" />
    <path d="M600 88 C610 96 620 96 630 88" />

    <path d="M520 622 C560 590 640 590 680 622" />
    <path d="M570 605 C590 570 610 570 630 605" />
    <path d="M600 612 C610 604 620 604 630 612" />
